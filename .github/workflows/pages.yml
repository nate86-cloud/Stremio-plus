name: Deploy Landing Page to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "landing page/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache only root? landing page has its own lockfile
          cache: npm
          cache-dependency-path: "landing page/package-lock.json"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build landing page (optional — committed dist is already patched for Pages)
        working-directory: landing page
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          # Build for local verification; committed dist is used if build output differs (Cloudflare SSR vs static)
          npm run build || echo "build finished with non-zero, continuing to deploy committed dist"
          echo "Build done. Checking outputs:"
          ls -la dist || true
          ls -la .output/public || true

      - name: Prepare Pages artifact (only landing page/dist, no docs fallback)
        run: |
          set -e
          SRC="landing page/dist"
          if [ ! -f "$SRC/index.html" ]; then
            echo "ERROR: landing page/dist/index.html not found — Pages must be served from landing page folder only."
            echo "Checked:"
            ls -la "landing page/dist" || true
            ls -la "landing page/.output/public" || true
            exit 1
          fi
          echo "Using source: $SRC (landing page only)"
          ls -la "$SRC" | head -n 30
          # Ensure relative base for GitHub Pages project site (already patched in committed dist, but re-apply for fresh builds)
          if [ -f "$SRC/index.html" ]; then
            echo "Ensuring relative base for $SRC/index.html..."
            sed -i 's|href="/assets/|href="./assets/|g' "$SRC/index.html" || true
            sed -i 's|src="/assets/|src="./assets/|g' "$SRC/index.html" || true
            sed -i 's|href="/favicon.png"|href="./favicon.png"|g' "$SRC/index.html" || true
            sed -i 's|href="/terms"|href="./terms/"|g' "$SRC/index.html" || true
            sed -i 's|"/assets/|"./assets/|g' "$SRC/index.html" || true
            sed -i 's|\./\./assets|./assets|g' "$SRC/index.html" || true
            sed -i 's|\.\./assets|./assets|g' "$SRC/index.html" || true
            if [ -f "$SRC/404.html" ]; then
              sed -i 's|href="/assets/|href="./assets/|g' "$SRC/404.html" || true
              sed -i 's|src="/assets/|src="./assets/|g' "$SRC/404.html" || true
              sed -i 's|href="/favicon.png"|href="./favicon.png"|g' "$SRC/404.html" || true
              sed -i 's|"/assets/|"./assets/|g' "$SRC/404.html" || true
            fi
            if [ -f "$SRC/terms/index.html" ]; then
              echo "Patching terms subpage..."
              sed -i 's|href="/assets/|href="../assets/|g' "$SRC/terms/index.html" || true
              sed -i 's|src="/assets/|src="../assets/|g' "$SRC/terms/index.html" || true
              sed -i 's|href="/favicon.png"|href="../favicon.png"|g' "$SRC/terms/index.html" || true
              sed -i 's|"/assets/|"../assets/|g' "$SRC/terms/index.html" || true
            fi
          fi
          touch "$SRC/.nojekyll"
          echo "Final Pages artifact (landing page/dist only):"
          ls -la "$SRC" | head -n 50
          mkdir -p /tmp/pages_artifact
          cp -R "$SRC"/* /tmp/pages_artifact/ 2>/dev/null || true
          cp -R "$SRC"/.* /tmp/pages_artifact/ 2>/dev/null || true
          ls -la /tmp/pages_artifact | head -n 50

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/pages_artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
